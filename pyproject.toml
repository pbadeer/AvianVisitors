[project]
name = "birdnet-pi"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "tflite-runtime",
    "librosa",
    "pytz",
    "tzlocal",
    "numpy",
    "pandas",
    "seaborn",
    "streamlit==1.44.0",
    "plotly",
    "apprise==1.9.5",
    "paho-mqtt!=2.0",
    "suntime==1.3.2",
    "inotify",
    "requests",
    "matplotlib",
    "pillow",
    "pyarrow==20.0.0",
    "soundfile",
]

[dependency-groups]
dev = ["pytest==7.1.2", "flake8"]

[tool.uv]
package = false
python-preference = "only-system"
environments = [
    "platform_machine == 'aarch64' and sys_platform == 'linux' and python_version == '3.9'",
    "platform_machine == 'aarch64' and sys_platform == 'linux' and python_version == '3.11'",
    "platform_machine == 'aarch64' and sys_platform == 'linux' and python_version == '3.12'",
    "platform_machine == 'aarch64' and sys_platform == 'linux' and python_version == '3.13'",
    "platform_machine == 'x86_64' and sys_platform == 'linux' and python_version == '3.9'",
    "platform_machine == 'x86_64' and sys_platform == 'linux' and python_version == '3.11'",
    "platform_machine == 'x86_64' and sys_platform == 'linux' and python_version == '3.12'",
    "platform_machine == 'x86_64' and sys_platform == 'linux' and python_version == '3.13'",
]

[tool.uv.sources]
tflite-runtime = [
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.11.0-cp39-none-linux_aarch64.whl", marker = "platform_machine == 'aarch64' and python_version == '3.9'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp311-cp311-linux_aarch64.whl", marker = "platform_machine == 'aarch64' and python_version == '3.11'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64' and python_version == '3.12'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp313-cp313-linux_aarch64.whl", marker = "platform_machine == 'aarch64' and python_version == '3.13'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.11.0-cp39-cp39-linux_x86_64.whl", marker = "platform_machine == 'x86_64' and python_version == '3.9'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp311-cp311-linux_x86_64.whl", marker = "platform_machine == 'x86_64' and python_version == '3.11'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64' and python_version == '3.12'" },
    { url = "https://github.com/Nachtzuster/BirdNET-Pi/releases/download/v0.1/tflite_runtime-2.17.1-cp313-cp313-linux_x86_64.whl", marker = "platform_machine == 'x86_64' and python_version == '3.13'" },
]
